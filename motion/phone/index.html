<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141b44">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>星星岛 · 手机输入端</title>
<link rel="stylesheet" href="phone.css">
</head>
<body>
<header>
  <div class="logo">⭐ 星星岛 <small>手机输入端</small></div>
  <div class="conn" id="conn"><i></i><span>连接中…</span></div>
</header>
<main>
  <section id="insecure" class="card warn" hidden>
    <h2>⚠️ 当前是兼容地址</h2>
    <p>手机浏览器只允许在 <b>https</b> 地址里使用摄像头和麦克风。这个地址只能当<b>遥控器</b>。</p>
    <p>想用摄像头 / 麦克风：回到电脑上的二维码重新扫码（https 地址），提示证书不安全时点「高级」→「继续访问」。</p>
    <a id="toHttps" class="btn" hidden>打开 https 地址</a>
  </section>

  <section id="ask" class="card ask" hidden>
    <h2>电脑想用你的 <span id="askWhat">摄像头</span></h2>
    <button class="btn big" id="askGo">好的，开始</button>
  </section>

  <section class="modes">
    <button class="mode" id="mCam"><b>📷</b><span>当摄像头</span><small>识别动作</small></button>
    <button class="mode" id="mMic"><b>🎤</b><span>当麦克风</span><small>声音传到电脑</small></button>
    <button class="mode" id="mAsr"><b>🗣️</b><span>语音识别</span><small>说答案（需联网）</small></button>
    <button class="mode" id="mPad"><b>🎮</b><span>遥控器</span><small>上下左右 / 确定</small></button>
  </section>

  <section id="camPanel" class="card" hidden>
    <div class="vwrap"><video id="pv" playsinline muted autoplay></video><div class="badge" id="vmode">准备中</div></div>
    <div class="row">
      <button class="chip" data-face="environment">后置摄像头</button>
      <button class="chip" data-face="user">前置摄像头</button>
      <button class="chip" id="stopCam">停止</button>
    </div>
    <div class="tips">
      <div class="tip-anim"><div class="tv"></div><div class="ph"></div><div class="kid"></div></div>
      <ul>
        <li>手机<b>横着</b>立在电视旁边（用支架或靠在东西上），镜头对着人</li>
        <li>人站在<b>离手机 2~3 米</b>，头到脚都能拍到</li>
        <li>请关掉自动锁屏，插上充电器</li>
      </ul>
    </div>
  </section>

  <section id="asrPanel" class="card" hidden>
    <div class="listen" id="listenState">等待电脑出题…</div>
    <div class="heard" id="heard"></div>
    <p class="small">电脑出题时，这里会自动开始听。也可以按住下面的按钮说话。</p>
    <button class="btn big" id="holdTalk">🎙️ 按住说话</button>
  </section>

  <section id="padPanel" class="card pad" hidden>
    <div class="dpad">
      <button data-k="up" class="u">▲</button><button data-k="left" class="l">◀</button><button data-k="ok" class="o">确定</button><button data-k="right" class="r">▶</button><button data-k="down" class="d">▼</button>
    </div>
    <button class="btn" data-k="back">返回</button>
  </section>

  <section class="card stat"><div id="stat">—</div></section>
</main>
<script src="phone.js"></script>
</body>
</html>
